[package]
name = "stimmy-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Stimmy, a native Stremio client for macOS."

[dependencies]
stimmy-core = { path = "../stimmy-core" }
# Kit pins a matching GPUI snapshot, so GPUI itself is never listed here. Pinned
# exactly because Kit and GPUI both make breaking changes between releases.
gpui-kit = "=0.9.0"
async-channel = "2"
raw-window-handle = "0.6"
serde_json.workspace = true
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSObject", "NSValue", "NSArray", "NSError", "NSProcessInfo", "NSURL"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime", "objc2"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDate", "CFCGTypes", "objc2"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVBase", "objc2"] }
objc2-open-gl = { version = "0.3", default-features = false, features = ["std", "CGLTypes"] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CAOpenGLLayer", "objc2-core-foundation", "objc2-core-video", "objc2-open-gl"] }

[dev-dependencies]
gpui-kit = { version = "=0.9.0", features = ["test-support"] }
tempfile = "3"
