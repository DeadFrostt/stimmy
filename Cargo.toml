[workspace]
members = ["crates/stimmy-core", "crates/stimmy-desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/DeadFrostt/stimmy"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.dev]
debug = 0

[profile.dev.package."*"]
opt-level = 1
